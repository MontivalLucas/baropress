[package]
name = "baropress"
version = "0.2.15"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "baropress_lib"
crate-type = ["staticlib", "rlib"]


[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serialport = "4.7"
