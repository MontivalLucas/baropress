<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" fill="none" role="img" aria-label="Ilustração de dois mapas plantares coloridos">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#9AAFCB" stroke-width="0.65" opacity="0.22"/>
    </pattern>
    <radialGradient id="gridFade">
      <stop offset="0" stop-color="white" stop-opacity="0.8"/>
      <stop offset="0.68" stop-color="white" stop-opacity="0.5"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="700" height="360" fill="url(#gridFade)"/></mask>
    <linearGradient id="base" x1="22" y1="36" x2="90" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60D8F7"/>
      <stop offset="0.42" stop-color="#30B8EE"/>
      <stop offset="1" stop-color="#72DFFF"/>
    </linearGradient>
    <radialGradient id="cool">
      <stop stop-color="#2473E8" stop-opacity="0.94"/>
      <stop offset="0.56" stop-color="#228DEC" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#39BEEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green">
      <stop stop-color="#52DF8D"/>
      <stop offset="0.56" stop-color="#50DBA8" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#3BD3D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm">
      <stop stop-color="#F26765"/>
      <stop offset="0.25" stop-color="#FF9259"/>
      <stop offset="0.5" stop-color="#FFD261"/>
      <stop offset="0.73" stop-color="#CDE978" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#71E1B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="toeWarm">
      <stop stop-color="#FFC35C"/>
      <stop offset="0.4" stop-color="#E9E66B"/>
      <stop offset="0.75" stop-color="#91E6A2"/>
      <stop offset="1" stop-color="#7DDFD7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="depth" x="-30%" y="-15%" width="160%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#4B8CCA" flood-opacity="0.12"/>
    </filter>
    <g id="foot">
      <path d="M42 66C63 59 87 63 100 77C114 91 111 112 101 132C91 151 78 167 79 183C80 200 96 216 99 238C103 264 94 286 76 292C59 299 37 291 29 273C20 254 25 233 25 212C25 190 19 175 13 154C5 129 0 108 8 91C14 79 27 70 42 66Z"/>
      <ellipse cx="96" cy="27" rx="17" ry="25" transform="rotate(8 96 27)"/>
      <ellipse cx="66" cy="22" rx="12" ry="19" transform="rotate(2 66 22)"/>
      <ellipse cx="43" cy="31" rx="10.8" ry="16.5" transform="rotate(-8 43 31)"/>
      <ellipse cx="24" cy="44" rx="9.2" ry="14" transform="rotate(-17 24 44)"/>
      <ellipse cx="9" cy="62" rx="8" ry="11.5" transform="rotate(-24 9 62)"/>
    </g>
    <clipPath id="footClip"><use href="#foot"/></clipPath>
    <g id="pressureFoot">
      <use href="#foot" fill="url(#base)"/>
      <g clip-path="url(#footClip)">
        <ellipse cx="52" cy="166" rx="48" ry="113" fill="url(#cool)"/>
        <ellipse cx="48" cy="102" rx="67" ry="67" fill="url(#green)"/>
        <ellipse cx="63" cy="100" rx="47" ry="42" fill="url(#warm)" filter="url(#soft)"/>
        <ellipse cx="28" cy="109" rx="23" ry="38" fill="url(#toeWarm)" opacity="0.92"/>
        <ellipse cx="78" cy="96" rx="15" ry="19" fill="#F16F65" opacity="0.77" filter="url(#soft)"/>
        <ellipse cx="60" cy="255" rx="48" ry="53" fill="url(#green)"/>
        <ellipse cx="61" cy="255" rx="40" ry="43" fill="url(#warm)" filter="url(#soft)"/>
        <ellipse cx="59" cy="257" rx="16" ry="20" fill="#F27469" opacity="0.58" filter="url(#soft)"/>
        <ellipse cx="96" cy="27" rx="23" ry="31" fill="url(#toeWarm)"/>
        <ellipse cx="96" cy="25" rx="8" ry="12" fill="#FFAF67" opacity="0.7" filter="url(#soft)"/>
        <ellipse cx="66" cy="22" rx="16" ry="24" fill="url(#green)"/>
        <ellipse cx="43" cy="31" rx="14" ry="21" fill="url(#green)"/>
        <ellipse cx="24" cy="44" rx="13" ry="18" fill="url(#green)" opacity="0.87"/>
        <path d="M31 83C49 69 79 70 95 88M30 238C26 262 38 283 60 285" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>
      </g>
      <use href="#foot" stroke="#2F9FD7" stroke-width="0.8" stroke-opacity="0.42"/>
    </g>
  </defs>
  <rect x="70" y="0" width="560" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <g transform="translate(201 16) scale(1.09)" filter="url(#depth)">
    <use href="#pressureFoot"/>
  </g>
  <g transform="translate(498 18) scale(-1.09 1.09)" filter="url(#depth)">
    <use href="#pressureFoot"/>
    <g clip-path="url(#footClip)">
      <ellipse cx="47" cy="101" rx="22" ry="24" fill="#F77C62" opacity="0.23" filter="url(#soft)"/>
      <ellipse cx="67" cy="259" rx="22" ry="27" fill="#FFD269" opacity="0.25" filter="url(#soft)"/>
    </g>
  </g>
  <path d="M344 212C353 202 345 194 352 185C358 177 348 169 354 162" stroke="#547AB4" stroke-width="1.3" stroke-linecap="round" opacity="0.4"/>
  <circle cx="350" cy="187" r="14" fill="#E7F1FF" fill-opacity="0.55" stroke="#6586BA" stroke-opacity="0.22"/>
  <path d="M350 178V183M350 191V196M341 187H346M354 187H359" stroke="#496DAB" stroke-width="1.15" stroke-linecap="round"/>
  <circle cx="350" cy="187" r="3.1" fill="#5575B5"/>
  <circle cx="350" cy="187" r="1.2" fill="white"/>
</svg>
