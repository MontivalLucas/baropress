<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf0fb">
  <meta name="description" content="Um novo olhar para o Baropress. Protótipo visual independente, com dados fictícios e estética Liquid Glass.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Baropress — Liquid Glass Concept</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Ir para o conteúdo</a>
  <div class="ambient" aria-hidden="true"><div class="ambient-orb orb-one"></div><div class="ambient-orb orb-two"></div><div class="ambient-orb orb-three"></div><div class="ambient-ribbon"></div></div>
  <div class="app-shell">
    <aside class="sidebar glass" id="sidebar" aria-label="Barra de navegação">
      <a href="#overview" class="brand" aria-label="Baropress, visão geral">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span><strong>baropress<span class="brand-dot">.</span></strong><small>CLINICAL WORKSPACE</small></span>
      </a>
      <div class="workspace-label"><span class="workspace-dot"></span> Espaço de demonstração</div>
      <nav id="navigation" aria-label="Navegação principal"></nav>
      <div class="sidebar-bottom">
        <div class="concept-card"><span class="concept-symbol" aria-hidden="true">✦</span><strong>Um novo olhar.</strong><p>Mais clareza.<br>Mais espaço para cuidar.</p><button class="text-button" data-action="about">Conheça o conceito <span aria-hidden="true">↗</span></button></div>
        <button class="nav-button settings-nav" data-page="settings"><span data-icon="settings"></span><span>Preferências</span></button>
        <div class="sidebar-profile"><span class="avatar">AC</span><span><strong>Ana Carvalho</strong><small>Perfil de demonstração</small></span><button class="icon-button" data-action="profile" aria-label="Ver perfil de demonstração"><span data-icon="chevrons"></span></button></div>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Fechar navegação"></button>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir navegação" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Visão geral</strong></div>
        <div class="topbar-actions">
          <button class="search-trigger glass" data-action="search" aria-label="Buscar no espaço de demonstração"><span data-icon="search"></span><span>Buscar no espaço</span><kbd>Ctrl K</kbd></button>
          <button class="icon-button glass" data-action="theme" id="theme-button" aria-label="Ativar tema escuro"><span data-icon="moon"></span></button>
          <button class="icon-button glass notification-button" data-action="notifications" aria-label="Abrir notificações de demonstração"><span data-icon="bell"></span><i></i></button>
          <button class="avatar top-avatar" data-action="profile" aria-label="Ver perfil de Ana Carvalho">AC</button>
        </div>
      </header>
      <main id="main-content" tabindex="-1"></main>
      <footer class="workspace-footer"><span class="demo-status"><i></i> Protótipo visual · dados fictícios</span><span>BAROPRESS <span class="footer-separator">/</span> Liquid Glass Concept <span class="footer-separator">/</span> 01</span></footer>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-message">Ative o JavaScript para explorar as interações visuais deste protótipo. Nenhuma conexão com o sistema atual é utilizada.</div></noscript>
</body>
</html>
