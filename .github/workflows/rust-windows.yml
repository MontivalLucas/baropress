name: Backend Rust (Windows)

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-windows.yml'
  push:
    branches:
      - 'codex/seguranca-serial-backup-20261026'
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-windows.yml'

jobs:
  rust-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Rust unit tests (Tauri backend)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
